[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-neuroevo"
version = "0.1.0"
description = "Code Bullet style neuroevolution cars with tkinter rendering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "tensorflow"
]

[tool.setuptools]
packages = ["neuroevo"]
